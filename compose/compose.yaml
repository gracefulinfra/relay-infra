# Relay dev stack: the backing services for day-to-day app work, in Docker Compose (ADR 0009).
# `make dev` starts it (scripts/dev.sh), `make dev-smoke` checks it, `make dev-down` removes it.
#
# The versions, buckets, S3 identities, realms, and telemetry wiring match the k3d platform
# (platform/). k3d (`make up`) is still the environment for GitOps, Argo Workflows, the
# portability rehearsal, and every gate, because those need Kubernetes.
#
# Secrets are generated by scripts/dev.sh into $RELAY_HOME/dev/.env (default ~/.relay-local), never
# in this repository. Every port listens on 127.0.0.1 only.
name: relay-dev

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  postgres:
    <<: *hardening
    # The same PostgreSQL major and minor as the CNPG clusters (docs/version-matrix.md).
    image: docker.io/library/postgres:17.11-trixie@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev.sh}
      RELAY_DB_PASSWORD: ${RELAY_DB_PASSWORD:?run scripts/dev.sh}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run scripts/dev.sh}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./config/postgres-init.sh:/docker-entrypoint-initdb.d/10-relay.sh:ro
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d relay"]
      interval: 5s
      retries: 30
    mem_limit: 256m

  seaweedfs:
    <<: *hardening
    # The same image as the S3 conformance target (Makefile SEAWEEDFS_IMAGE) and platform/seaweedfs.
    image: docker.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    # The IAM config (built by scripts/dev.sh from the per-consumer identities) arrives base64-encoded
    # through env_file, not a bind mount: on Linux the image's `seaweed` user cannot read a mode-600
    # host file. This is SEAWEEDFS_ENTRYPOINT in scripts/lib.sh, for the one file.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        umask 077 && mkdir -p /run/relay-s3 &&
        printf '%s' "$$RELAY_S3_CONFIG_B64" | base64 -d >/run/relay-s3/s3.json &&
        chown -R seaweed:seaweed /run/relay-s3 && exec /entrypoint.sh "$$@"
      - --
    command: ["server", "-dir=/data", "-s3", "-s3.config=/run/relay-s3/s3.json", "-volume.max=50", "-ip.bind=0.0.0.0"]
    env_file: ["${RELAY_DEV_DIR:?run scripts/dev.sh}/seaweedfs.env"]
    environment:
      GOMEMLIMIT: 360MiB
    volumes:
      - seaweedfs:/data
    ports: ["127.0.0.1:18333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status"]
      interval: 5s
      retries: 30
    mem_limit: 512m

  # One-shot: the four private buckets, as platform/seaweedfs creates them.
  seaweedfs-buckets:
    image: docker.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    depends_on: {seaweedfs: {condition: service_healthy}}
    entrypoint: ["sh", "-c"]
    command:
      - for b in relay-media relay-feeds relay-backups relay-logs; do
          echo "s3.bucket.create -name $$b" | weed shell -master=seaweedfs:9333 >/dev/null;
        done; echo buckets ready
    restart: "no"

  keycloak:
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    command: ["start-dev", "--import-realm"]
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      KC_HOSTNAME: http://localhost:18180
      KC_HEALTH_ENABLED: "true"
      KC_CACHE: local
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: relay-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run scripts/dev.sh}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=30"
      # Filled into the realm JSON's test users, exactly as on the platform.
      RELAY_STAFF_USERNAME: ${RELAY_STAFF_USERNAME}
      RELAY_STAFF_PASSWORD: ${RELAY_STAFF_PASSWORD}
      RELAY_STAFF_TOTP_SECRET: ${RELAY_STAFF_TOTP_SECRET}
      RELAY_LISTENER_USERNAME: ${RELAY_LISTENER_USERNAME}
      RELAY_LISTENER_PASSWORD: ${RELAY_LISTENER_PASSWORD}
    volumes:
      # The same realm files the platform imports.
      - ../platform/keycloak/realms:/opt/keycloak/data/import:ro
    ports: ["127.0.0.1:18180:8080"]
    healthcheck:
      # The image has bash but no curl or wget.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"
      interval: 10s
      retries: 30
      start_period: 30s
    mem_limit: 768m

  # --- observability profile: `make dev PROFILE=observability` -------------------------------------
  otel-collector:
    <<: *hardening
    profiles: [observability]
    image: docker.io/otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      seaweedfs-buckets: {condition: service_completed_successfully}
      tempo: {condition: service_started}
      prometheus: {condition: service_started}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_OTEL_ACCESS_KEY_ID:?run scripts/dev.sh}
      AWS_SECRET_ACCESS_KEY: ${S3_OTEL_SECRET_ACCESS_KEY:?run scripts/dev.sh}
    volumes: ["./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    mem_limit: 256m

  tempo:
    <<: *hardening
    profiles: [observability]
    image: docker.io/grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    command: ["-config.file=/etc/tempo.yaml"]
    user: "10001"
    volumes: ["./config/tempo.yaml:/etc/tempo.yaml:ro", "tempo:/var/tempo"]
    mem_limit: 384m

  prometheus:
    <<: *hardening
    profiles: [observability]
    image: docker.io/prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-otlp-receiver
    volumes: ["./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus:/prometheus"]
    ports: ["127.0.0.1:19090:9090"]
    mem_limit: 384m

  grafana:
    <<: *hardening
    profiles: [observability]
    image: docker.io/grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    environment:
      GF_SECURITY_ADMIN_USER: relay-admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run scripts/dev.sh}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GOMEMLIMIT: 340MiB
    volumes: ["./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/relay.yaml:ro"]
    ports: ["127.0.0.1:13000:3000"]
    mem_limit: 512m

volumes:
  postgres:
  seaweedfs:
  tempo:
  prometheus:
