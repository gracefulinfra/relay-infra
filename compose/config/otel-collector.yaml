# The same routing as platform/observability/otel-collector.yaml, minus the Kubernetes-only parts
# (filelog of /var/log/pods, k8sattributes). Services send OTLP to localhost:4317/4318.
receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
processors:
  memory_limiter: {check_interval: 5s, limit_percentage: 80, spike_limit_percentage: 25}
  batch: {}
  batch/logs: {timeout: 30s, send_batch_size: 5000}
exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
  otlp_http/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    tls: {insecure: true}
  awss3/logs:
    s3uploader:
      region: us-east-1
      s3_bucket: relay-logs
      s3_prefix: otel
      s3_partition_format: "year=%Y/month=%m/day=%d/hour=%H/minute=%M"
      endpoint: http://seaweedfs:8333
      s3_force_path_style: true
      disable_ssl: true
      compression: gzip
    marshaler: otlp_json
extensions:
  health_check: {endpoint: 0.0.0.0:13133}
service:
  extensions: [health_check]
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_grpc/tempo]}
    metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_http/prometheus]}
    logs: {receivers: [otlp], processors: [memory_limiter, batch/logs], exporters: [awss3/logs]}
