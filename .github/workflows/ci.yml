name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.3.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: 1.27.1
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.14.0
          install-only: true
      - run: make lint
      - run: make test
      - run: make vuln

  # P0-06: the S3 conformance suite against the SeaweedFS version platform/seaweedfs deploys, started in
  # Docker with per-run random credentials. Any hard-case failure fails the job; the report is attached.
  s3-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: 1.27.1
          cache: false
      - name: make conformance-s3
        shell: bash # -eo pipefail, so a failing suite fails the step despite tee
        run: |
          make conformance-s3 ARGS="-target=seaweedfs-4.47 -report-dir=$RUNNER_TEMP/s3-conformance" 2>&1 | tee conformance.log
      - name: Report
        if: always()
        run: |
          report=$(ls "$RUNNER_TEMP"/s3-conformance/*.md 2>/dev/null | head -1)
          if [ -n "$report" ]; then cat "$report"; else echo "No report was written."; fi >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: s3-conformance
          path: |
            ${{ runner.temp }}/s3-conformance/
            conformance.log
          if-no-files-found: warn

  # The "clean machine" run: a fresh runner creates the k3d cluster, reconciles envs/local from this
  # commit (LOCAL_GIT=1 serves the checkout from the in-cluster git server), and runs the smoke test.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=k3d-io/k3d
      K3D_VERSION: v5.9.0
      # Update with K3D_VERSION: sha256 of k3d-linux-amd64 from the release checksums.txt.
      K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.3.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: 1.27.1
          cache: false
      - name: Install k3d
        run: |
          curl -fsSLo /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
      - name: Record runner resources
        run: |
          {
            echo "### Runner"
            echo '```'
            nproc; free -h; df -h /
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: make up
        run: |
          # The CI identity commits the snapshot pushed to the in-cluster git server.
          git config --global user.email ci@relay.invalid
          git config --global user.name relay-ci
          LOCAL_GIT=1 scripts/up.sh 2>&1 | tee up.log
          { echo "### make up"; echo '```'; tail -8 up.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: smoke
        run: |
          scripts/smoke.sh 2>&1 | tee smoke.log
          { echo "### smoke"; echo '```'; cat smoke.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Resource usage
        if: always()
        run: |
          {
            echo "### Resource usage"
            echo '```'
            kubectl --context k3d-relay top node || true
            kubectl --context k3d-relay top pods -A --sort-by=memory || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnostics
        if: failure()
        run: |
          kubectl --context k3d-relay get applications.argoproj.io -A -o wide || true
          kubectl --context k3d-relay get pods -A -o wide || true
          kubectl --context k3d-relay get events -A --sort-by=.lastTimestamp | tail -100 || true
