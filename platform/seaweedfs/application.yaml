# SeaweedFS in all-in-one mode (master, volume, filer and S3 gateway in one pod): the local and
# self-hosted S3 implementation (decision A6). Environments with a managed S3 service drop this
# Application and point the relay-s3 knobs at their provider (envs/README.md).
# Every bucket is private: S3 auth is on, and no bucket allows anonymous reads.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: seaweedfs
  source:
    repoURL: https://seaweedfs.github.io/seaweedfs/helm
    chart: seaweedfs
    targetRevision: 4.47.0 # SeaweedFS 4.47
    helm:
      releaseName: seaweedfs
      valuesObject:
        master: {enabled: false}
        volume: {enabled: false}
        filer: {enabled: false}
        allInOne:
          enabled: true
          s3:
            enabled: true
            enableAuth: true
            # Synced by ExternalSecret/seaweedfs-s3-config; scripts/secrets.sh builds it from the per-consumer identities.
            existingConfigSecret: seaweedfs-s3-config
            createBuckets:
              - {name: relay-media, anonymousRead: false}
              - {name: relay-feeds, anonymousRead: false}
              - {name: relay-backups, anonymousRead: false}
              - {name: relay-logs, anonymousRead: false}
          data:
            type: persistentVolumeClaim
            size: 10Gi
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          # Upstream image runs as root; non-root + read-only root FS is a P1-19 follow-up.
          containerSecurityContext:
            allowPrivilegeEscalation: false
            seccompProfile: {type: RuntimeDefault}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
