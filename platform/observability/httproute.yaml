apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  parentRefs:
    - name: relay
      namespace: relay-gateway
      sectionName: https
  hostnames:
    - grafana.relay.example.invalid
  rules:
    - backendRefs:
        - name: grafana
          port: 80
