# Grafana's admin login, generated by scripts/secrets.sh (never the chart default).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-60"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: relay-secrets}
  target: {name: grafana-admin}
  dataFrom:
    - extract: {key: grafana-admin}
---
# The otel S3 identity, scoped to relay-logs only, as the AWS SDK variables the awss3 exporter reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-s3
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-60"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: relay-secrets}
  target:
    name: otel-s3
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
  dataFrom:
    - extract: {key: s3-otel}
