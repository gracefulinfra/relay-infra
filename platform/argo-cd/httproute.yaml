apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
spec:
  parentRefs:
    - name: relay
      namespace: relay-gateway
      sectionName: https
  hostnames:
    - argocd.relay.example.invalid
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
