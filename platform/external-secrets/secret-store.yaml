# The one ClusterSecretStore every ExternalSecret reads from. The base is provider-neutral in shape only:
# each env overlay supplies spec.provider (envs/local: the Kubernetes provider reading relay-secret-source).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: relay-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-70"
spec:
  provider: {}
