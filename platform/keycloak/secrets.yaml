apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-backup
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-60"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: relay-secrets}
  target: {name: s3-backup}
  dataFrom:
    - extract: {key: s3-cnpg}
---
