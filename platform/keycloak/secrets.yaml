---
# Test users for the realm import (local and CI only; provider overlays remove this and the users).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-test-users
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-60"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: relay-secrets}
  target: {name: keycloak-test-users}
  dataFrom:
    - extract: {key: keycloak-test-users}
