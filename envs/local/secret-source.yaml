# Local-only: the identity ESO uses to read the script-generated Secrets in relay-secret-source.
# It can read Secrets in that one namespace and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
  namespace: relay-secret-source
  annotations:
    argocd.argoproj.io/sync-wave: "-70"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: relay-secret-source
  annotations:
    argocd.argoproj.io/sync-wave: "-70"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-reader
  namespace: relay-secret-source
  annotations:
    argocd.argoproj.io/sync-wave: "-70"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
subjects:
  - kind: ServiceAccount
    name: secret-reader
    namespace: relay-secret-source
