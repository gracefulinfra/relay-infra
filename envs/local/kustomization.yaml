# Local k3d environment. Everything that differs by environment is patched in here; see ../README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../platform/namespaces
  - ../../platform/argo-cd
  - ../../platform/external-secrets
  - ../../platform/envoy-gateway
  - ../../platform/cert-manager
  - ../../platform/cloudnative-pg
  - ../../platform/seaweedfs
  - ../../platform/postgres
  - ../../platform/keycloak
  - ../../platform/argo-workflows
components:
  # Secrets: ESO's Kubernetes provider reads what scripts/secrets.sh generated in relay-secret-source.
  - ../components/local-secrets
patches:
  # Base domain: *.relay.localtest.me resolves to 127.0.0.1.
  - target: {kind: Gateway, name: relay}
    patch: |-
      - {op: replace, path: /spec/listeners/0/hostname, value: "*.relay.localtest.me"}
      - {op: replace, path: /spec/listeners/1/hostname, value: "*.relay.localtest.me"}
  - target: {kind: HTTPRoute, name: argocd}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: argocd.relay.localtest.me}
  # TLS: a CA issuer over the local CA that scripts/secrets.sh keeps in $RELAY_HOME.
  - target: {kind: ClusterIssuer, name: relay-issuer}
    patch: |-
      - {op: replace, path: /spec, value: {ca: {secretName: relay-local-ca}}}
  # Load balancer: klipper servicelb on the single k3d node; k3d maps host ports 80/443 to it.
  - target: {kind: EnvoyProxy, name: relay-proxy}
    patch: |-
      - {op: add, path: /spec/provider/kubernetes/envoyService/externalTrafficPolicy, value: Cluster}
  - target: {kind: HTTPRoute, name: keycloak}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: auth.relay.localtest.me}
  - target: {kind: Deployment, name: keycloak}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: "https://auth.relay.localtest.me"}
  # S3 endpoint for CNPG backups and Argo Workflows artifacts.
  - target: {kind: ObjectStore}
    patch: |-
      - {op: replace, path: /spec/configuration/endpointURL, value: "http://seaweedfs-all-in-one.seaweedfs.svc:8333"}
  - target: {kind: Application, name: argo-workflows}
    patch: |-
      - {op: replace, path: /spec/source/helm/valuesObject/artifactRepository/s3/endpoint, value: "seaweedfs-all-in-one.seaweedfs.svc:8333"}
      - {op: replace, path: /spec/source/helm/valuesObject/artifactRepository/s3/insecure, value: true}
      # Laptop profile: heavy media workflows run one at a time.
      - {op: add, path: /spec/source/helm/valuesObject/controller/parallelism, value: 1}
