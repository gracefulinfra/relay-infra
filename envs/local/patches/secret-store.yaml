apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: relay-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: relay-secret-source
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: relay-secret-source
      auth:
        serviceAccount:
          name: secret-reader
          namespace: relay-secret-source
