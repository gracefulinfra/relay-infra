# provider-a: compile-only stub (P0-05). Every provider-specific value is a placeholder under .example
# (RFC 2606) or PLACEHOLDER_*; P0-07 turns one of these into a real second environment. See ../README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../platform/namespaces
  - ../../platform/argo-cd
  - ../../platform/external-secrets
  - ../../platform/envoy-gateway
  - ../../platform/cert-manager
  - ../../platform/cloudnative-pg
  - ../../platform/seaweedfs
  - ../../platform/postgres
  - ../../platform/keycloak
  - ../../platform/argo-workflows
  - ../../platform/observability
patches:
  # Base domain.
  - target: {kind: Gateway, name: relay}
    patch: |-
      - {op: replace, path: /spec/listeners/0/hostname, value: "*.relay.provider-a.example"}
      - {op: replace, path: /spec/listeners/1/hostname, value: "*.relay.provider-a.example"}
  - target: {kind: HTTPRoute, name: argocd}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: argocd.relay.provider-a.example}
  # Secrets: the provider's secret manager or KMS-backed vault. The Vault-API provider stands in for it.
  - target: {kind: ClusterSecretStore, name: relay-secrets}
    patch: |-
      - op: replace
        path: /spec/provider
        value:
          vault:
            server: https://secrets.provider-a.example
            path: PLACEHOLDER_SECRETS_PATH
            version: v2
            auth:
              kubernetes:
                mountPath: PLACEHOLDER_AUTH_MOUNT
                role: PLACEHOLDER_ROLE
  # TLS: ACME with DNS-01 (wildcards need DNS-01). The DNS solver is provider-specific.
  - target: {kind: ClusterIssuer, name: relay-issuer}
    patch: |-
      - op: replace
        path: /spec
        value:
          acme:
            server: https://acme-staging-v02.api.letsencrypt.org/directory
            email: PLACEHOLDER@provider-a.example
            privateKeySecretRef:
              name: relay-issuer-account
            solvers:
              - dns01:
                  webhook:
                    groupName: acme.provider-a.example
                    solverName: PLACEHOLDER_DNS_SOLVER
  # Load balancer: provider annotations on the Envoy Service.
  - target: {kind: EnvoyProxy, name: relay-proxy}
    patch: |-
      - op: add
        path: /spec/provider/kubernetes/envoyService/annotations
        value:
          relay.dev/load-balancer: PLACEHOLDER_LB_ANNOTATIONS
  - target: {kind: HTTPRoute, name: keycloak}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: auth.relay.provider-a.example}
  - target: {kind: Deployment, name: keycloak}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: "https://auth.relay.provider-a.example"}
  # Observability: the Grafana hostname, and the S3 endpoint the collector ships logs to (relay-logs).
  - target: {kind: HTTPRoute, name: grafana}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: grafana.relay.provider-a.example}
  - target: {kind: Application, name: grafana}
    patch: |-
      - op: replace
        path: /spec/source/helm/valuesObject/grafana.ini/server/root_url
        value: "https://grafana.relay.provider-a.example"
  - target: {kind: Application, name: otel-collector}
    patch: |-
      - op: replace
        path: /spec/source/helm/valuesObject/config/exporters/awss3~1logs/s3uploader/endpoint
        value: "https://s3.provider-a.example"
      - op: replace
        path: /spec/source/helm/valuesObject/config/exporters/awss3~1logs/s3uploader/disable_ssl
        value: false
  # S3 endpoint for CNPG backups and Argo Workflows artifacts.
  - target: {kind: ObjectStore}
    patch: |-
      - {op: replace, path: /spec/configuration/endpointURL, value: "https://s3.provider-a.example"}
  - target: {kind: Application, name: argo-workflows}
    patch: |-
      - {op: replace, path: /spec/source/helm/valuesObject/artifactRepository/s3/endpoint, value: "s3.provider-a.example"}
      - {op: replace, path: /spec/source/helm/valuesObject/artifactRepository/s3/insecure, value: false}
  # Managed S3 replaces SeaweedFS in provider environments.
  - target: {kind: Application, name: seaweedfs}
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: seaweedfs
  - target: {kind: ExternalSecret, name: seaweedfs-s3-config}
    patch: |-
      $patch: delete
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: seaweedfs-s3-config
  # Storage class for PostgreSQL volumes.
  - target: {kind: Cluster, group: postgresql.cnpg.io}
    patch: |-
      - {op: add, path: /spec/storage/storageClass, value: PLACEHOLDER_STORAGE_CLASS}
